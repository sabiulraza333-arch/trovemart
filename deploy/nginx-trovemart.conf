# TroveMart — static site + PHP (Stripe checkout / webhook / orders)
# Install:  sudo cp /home/cnc/trovemart.conf /etc/nginx/sites-available/trovemart
#           sudo nginx -t && sudo systemctl reload nginx
# NOTE: isolated server block — does NOT touch the `odoo` site. Graceful reload only.

server {
    server_name trovemart.co.uk www.trovemart.co.uk;

    root /var/www/html/trovemart;
    index index.html;

    access_log /var/log/nginx/trovemart.access.log;
    error_log  /var/log/nginx/trovemart.error.log;

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    location ~* \.(css|js)$ {
        expires 1M;
        add_header Cache-Control "public";
        access_log off;
    }

    # Never serve the payment config or saved order records as downloadable files
    location = /config.php { deny all; }
    location ^~ /orders/   { deny all; }

    # Process PHP (checkout.php, webhook.php, orders.php)
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Block dotfiles but allow ACME (Let's Encrypt) challenge
    location ~ /\.(?!well-known) {
        deny all;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/trovemart.co.uk/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/trovemart.co.uk/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.trovemart.co.uk) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = trovemart.co.uk) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name trovemart.co.uk www.trovemart.co.uk;
    return 404; # managed by Certbot
}
